name: Private TWRP candidate
# Only enable in a PRIVATE build repository with disposable macOS workers.
on:
  workflow_dispatch:
    inputs:
      experimental_installer:
        description: Enable hardware-unqualified writes after physical confirmation (otherwise preflight-only)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: private-image-candidate
  cancel-in-progress: false
jobs:
  candidate:
    if: github.event.repository.private && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.ENABLE_PRIVATE_IMAGE_BUILDS == 'true'
    environment: private-images
    runs-on: [self-hosted, macOS, exynos990-private]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Stage private input snapshot
        env:
          PRIVATE_INPUTS_ROOT: ${{ vars.PRIVATE_INPUTS_ROOT }}
        run: |
          test -n "$PRIVATE_INPUTS_ROOT"
          python3 tools/release/private_store.py stage --snapshot "$PRIVATE_INPUTS_ROOT"
      - name: Build and verify final TWRP ZIP
        env:
          HACKIOS_IMAGE_CACHE: /var/cache/exynos990/private-images
          EXPERIMENTAL_INSTALLER: ${{ inputs.experimental_installer }}
        run: |
          if [ "$EXPERIMENTAL_INSTALLER" = true ]; then
            ./build.sh local --output dist/candidate --experimental
          else
            ./build.sh local --output dist/candidate
          fi
          test -s dist/candidate.zip
          test -s dist/candidate.zip.sha256
          test -s dist/candidate.zip.build.json
      - name: Retain deduplicated image objects privately
        env:
          PRIVATE_STORE_ROOT: ${{ vars.PRIVATE_STORE_ROOT }}
        run: |
          test -n "$PRIVATE_STORE_ROOT"
          python3 tools/release/private_store.py retain --bundle dist/candidate --store "$PRIVATE_STORE_ROOT"
      - name: Downloadable ZIP in this private workflow run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: x1slte-twrp-${{ github.sha }}-${{ github.run_id }}
          path: |
            dist/candidate.zip
            dist/candidate.zip.sha256
            dist/candidate.zip.build.json
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
