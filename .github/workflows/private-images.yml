name: Private image candidate
# Only enable in a PRIVATE build repository with disposable macOS workers.
# Never attach the developer's Mac/phone or private inputs to public PR jobs.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-image-candidate
  cancel-in-progress: false
jobs:
  candidate:
    if: github.event.repository.private && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.ENABLE_PRIVATE_IMAGE_BUILDS == 'true'
    environment: private-images
    runs-on: [self-hosted, macOS, exynos990-private]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Stage private input snapshot
        env:
          PRIVATE_INPUTS_ROOT: ${{ vars.PRIVATE_INPUTS_ROOT }}
        run: |
          test -n "$PRIVATE_INPUTS_ROOT"
          python3 tools/release/private_store.py stage --snapshot "$PRIVATE_INPUTS_ROOT"
      - name: Assemble private candidate
        env:
          HACKIOS_IMAGE_CACHE: /var/cache/exynos990/private-images
        run: |
          ./build.sh images --device x1slte --development
          ./build.sh package --output dist/candidate
          ./run.sh verify --bundle dist/candidate
      - name: Retain privately
        env:
          PRIVATE_STORE_ROOT: ${{ vars.PRIVATE_STORE_ROOT }}
        run: |
          test -n "$PRIVATE_STORE_ROOT"
          python3 tools/release/private_store.py retain --bundle dist/candidate --store "$PRIVATE_STORE_ROOT"
